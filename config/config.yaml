features:
  age:
    type: numeric
    metrics:
      - missing_rate
      - psi
    thresholds:            # <-- override только для этой фичи
      psi:
        warning: 0.05
        critical: 0.12

  income:
    type: numeric
    metrics:
      - missing_rate
      - psi
    # thresholds не заданы — psi возьмётся из глобальных

  country:
    type: categorical
    metrics:
      - missing_rate
      - psi
      - unseen_category_rate
      - cardinality_ratio

prediction_metrics:
  enabled: true
  score_column: prediction_score
  type: numeric
  metrics:
    - psi

thresholds:               # глобальные дефолты
  missing_rate:
    warning: 0.02
    critical: 0.05
  psi:
    warning: 0.1
    critical: 0.25
  unseen_category_rate:
    warning: 0.05
    critical: 0.1
  cardinality_ratio:
    warning: 0.3
    critical: 0.6

stream_drift:
  drift_event_time_lag_seconds:
    warning: 30
    critical: 120
  drift_late_events_total:
    warning: 10
    critical: 50
  # остальные поля не заданы — значит не мониторятся

adversarial_validation:
  enabled: false
  interval_minutes: 30
  # все остальное - опционально
  max_samples: 50000
  n_splits: 5
  random_state: 42
  missing_category: "__missing__"
  lightgbm:
    n_estimators: 200
    learning_rate: 0.03
    max_depth: 4
    num_leaves: 15
    subsample: 0.8
    colsample_bytree: 0.8
    reg_alpha: 1.0
    reg_lambda: 1.0
    random_state: 42
