features:
  age:
    type: numeric
    metrics:
      - missing_rate
      - psi

  income:
    type: numeric
    metrics:
      - missing_rate
      - psi

  country:
    type: categorical
    metrics:
      - missing_rate
      - psi
      - unseen_category_rate
      - cardinality_ratio

prediction_metrics:
  enabled: true
  score_column: prediction_score
  type: numeric
  metrics:
    - psi

thresholds:
  psi:
    warning: 0.1
    critical: 0.25
  unseen_category_rate:
    warning: 0.05
    critical: 0.1

