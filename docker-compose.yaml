name: drift_guardian

services:
  analyzer:
    profiles: ["realtime"]
    build:
      context: .
      dockerfile: src/drift_guardian/Dockerfile
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-features-stream}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-drift-consumer}
      KAFKA_STARTUP_TIMEOUT_SECONDS: ${KAFKA_STARTUP_TIMEOUT_SECONDS:-60}
      KAFKA_STARTUP_RETRY_SECONDS: ${KAFKA_STARTUP_RETRY_SECONDS:-1}
      WINDOW_SIZE: ${WINDOW_SIZE:-1000}
      LATE_EVENT_THRESHOLD_SECONDS: ${LATE_EVENT_THRESHOLD_SECONDS:-60}
      REFERENCE_DATA_PATH: ${REFERENCE_DATA_PATH:-/app/data/demo_reference.csv}
      GENERATE_DEMO_REFERENCE: ${GENERATE_DEMO_REFERENCE:-true}
      DEMO_REFERENCE_ROWS: ${DEMO_REFERENCE_ROWS:-10000}
      DEMO_REFERENCE_SEED: ${DEMO_REFERENCE_SEED:-42}
      REFERENCE_SAMPLE_MULTIPLIER: ${REFERENCE_SAMPLE_MULTIPLIER:-10}
      REFERENCE_SAMPLE_RANDOM_STATE: ${REFERENCE_SAMPLE_RANDOM_STATE:-42}
      DRIFT_CONFIG_PATH: /app/config/config.yaml
      ENABLE_SCHEMA_CHECK: ${ENABLE_SCHEMA_CHECK:-true}
      ENABLE_ADVERSARIAL_VALIDATION: ${ENABLE_ADVERSARIAL_VALIDATION:-true}
      ADVERSARIAL_TOP_FEATURES: ${ADVERSARIAL_TOP_FEATURES:-10}
      PROMETHEUS_PORT: 8000
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
      - ./reports:/app/reports:ro
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/metrics', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      default:
        aliases:
          - drift-exporter

  drift-mock-exporter:
    profiles: ["mock"]
    build:
      context: ./monitoring/mock_exporter
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      default:
        aliases:
          - drift-exporter

  prometheus:
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro

  grafana:
    image: grafana/grafana:13.2.1
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_ANONYMOUS_HIDE_VERSION: "true"
      
      # Used by alerting provisioning YAML (token set in .env file)
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
    volumes:
      # Grafana data volume backup
      # - grafana-data:/var/lib/grafana

      # Grafana new test volume with alerting
      - grafana-data-v2:/var/lib/grafana
      
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  kafka:
    profiles: ["realtime"]
    image: apache/kafka:4.3.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  kafka-init:
    profiles: ["realtime"]
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      /opt/kafka/bin/kafka-topics.sh
      --bootstrap-server kafka:19092
      --create --if-not-exists
      --topic ${KAFKA_TOPIC:-features-stream}
      --partitions 1
      --replication-factor 1
    restart: "no"

  drift-producer:
    profiles: ["realtime"]
    build:
      context: .
      dockerfile: src/drift_guardian/Dockerfile
    depends_on:
      analyzer:
        condition: service_healthy
    command:
      - python
      - -m
      - drift_guardian.ingestion.producer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-features-stream}
      PRODUCER_INTERVAL_SECONDS: ${PRODUCER_INTERVAL_SECONDS:-0.2}

volumes:
  # grafana-data:
  grafana-data-v2:
