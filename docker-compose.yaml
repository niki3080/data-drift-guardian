name: drift_guardian

services:
  analyzer:
    build:
      context: .
      dockerfile: src/drift_guardian/Dockerfile
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:19092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-features-stream}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-drift-consumer}
      WINDOW_SIZE: ${WINDOW_SIZE:-1000}
      MIN_WINDOW_SIZE: ${MIN_WINDOW_SIZE:-300}
      ANALYZE_EVERY_N_EVENTS: ${ANALYZE_EVERY_N_EVENTS:-1}
      LATE_EVENT_THRESHOLD_SECONDS: ${LATE_EVENT_THRESHOLD_SECONDS:-60}
      PROMETHEUS_PORT: 8000
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/metrics', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
    depends_on:
      analyzer:
        condition: service_healthy

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_ANONYMOUS_HIDE_VERSION: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  kafka:
    image: apache/kafka:4.3.1
    profiles:
      - kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  kafka-init:
    image: apache/kafka:4.3.1
    profiles:
      - kafka
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      /opt/kafka/bin/kafka-topics.sh
      --bootstrap-server kafka:19092
      --create --if-not-exists
      --topic ${KAFKA_TOPIC:-features-stream}
      --partitions 1
      --replication-factor 1
    restart: "no"

  drift-producer:
    build:
      context: .
      dockerfile: src/drift_guardian/Dockerfile
    profiles:
      - kafka
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    command:
      - python
      - -m
      - drift_guardian.ingestion.producer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-features-stream}
      PRODUCER_INTERVAL_SECONDS: ${PRODUCER_INTERVAL_SECONDS:-0.2}

volumes:
  grafana-data:
