name: drift_guardian

services:
  analyzer:
    profiles: ["realtime"]
    build:
      context: .
      dockerfile: src/drift_guardian/Dockerfile
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
        required: false
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:19092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-features-stream}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-drift-consumer}
      KAFKA_STARTUP_TIMEOUT_SECONDS: ${KAFKA_STARTUP_TIMEOUT_SECONDS:-60}
      KAFKA_STARTUP_RETRY_SECONDS: ${KAFKA_STARTUP_RETRY_SECONDS:-1}
      WINDOW_SIZE: ${WINDOW_SIZE:-1000}
      LATE_EVENT_THRESHOLD_SECONDS: ${LATE_EVENT_THRESHOLD_SECONDS:-60}
      REFERENCE_DATA_PATH: ${REFERENCE_DATA_PATH:-/app/data/reference.csv}
      DRIFT_CONFIG_PATH: /app/config/config.yaml
      ADVERSARIAL_TOP_FEATURES: ${ADVERSARIAL_TOP_FEATURES:-10}
      AV_WARNING_THRESHOLD: ${AV_WARNING_THRESHOLD:-0.60}
      AV_CRITICAL_THRESHOLD: ${AV_CRITICAL_THRESHOLD:-0.75}
      PROMETHEUS_PORT: 8000
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
      - ./reports:/app/reports:ro
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/metrics', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      default:
        aliases:
          - drift-exporter

  drift-mock-exporter:
    profiles: ["mock"]
    build:
      context: ./monitoring/mock_exporter
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      default:
        aliases:
          - drift-exporter

  # Синтетический генератор demo-событий. Смысл существования — только
  # для локальной демонстрации analyzer/Grafana без реального внешнего
  # источника данных. С внешним production Kafka не используется вовсе.
  drift-producer:
    profiles: ["local-kafka"]
    build:
      context: ./tools/demo_producer
    depends_on:
      analyzer:
        condition: service_healthy
      kafka:
        condition: service_healthy
        required: false
    volumes:
      - ./data/reference.csv:/app/reference.csv:ro
      - ./tools/demo_producer/drift_config.yaml:/app/drift_config.yaml:ro
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:19092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-features-stream}
      PRODUCER_INTERVAL_SECONDS: ${PRODUCER_INTERVAL_SECONDS:-0.2}
      REFERENCE_DATASET_PATH: /app/reference.csv
      DRIFT_CONFIG_PATH: /app/drift_config.yaml
      RANDOM_SEED: ${PRODUCER_RANDOM_SEED:-42}

  # Локальный demo-брокер. Поднимается только явным профилем local-kafka.
  # Для внешнего Kafka просто не указывайте этот профиль и задайте
  # KAFKA_BOOTSTRAP_SERVERS в .env — analyzer подключится напрямую к нему.
  kafka:
    profiles: ["local-kafka"]
    image: apache/kafka:4.3.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  prometheus:
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro

  grafana:
    image: grafana/grafana:13.2.1
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_ANONYMOUS_HIDE_VERSION: "true"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  grafana-data:
