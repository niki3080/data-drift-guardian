global:
  scrape_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  # Both realtime analyzer and mock exporter use this Docker network alias.
  # Run only one profile at a time: --profile realtime OR --profile mock.
  - job_name: drift-exporter
    static_configs:
      - targets:
          - drift-exporter:8000
